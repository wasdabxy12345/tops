<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>only print even numbers</title>
</head>

<body>
    <input type="number" placeholder="enter number" id="n">
    <button onclick="onlyPrintEven(parseInt(document.getElementById('n').value))">submit</button>
    <p id="op"></p>
    <script>
        function onlyPrintEven(n) {
            var i = 1;
            while (i < n) {
                if (i % 2 != 0) {
                    i++;
                    continue;
                }
                document.getElementById('op').innerHTML += `${i} <br>`;
                i++;
            }
        }
    </script>
</body>

</html>
