<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" placeholder="input number" id="n1">
    <button onclick="myfun()">submit</button>
    <p id="op"></p>
    <script>
        function myfun() {
            let n1 = document.getElementById('n1').value, op = document.getElementById('op');
            let n = parseInt(n1);
            let i, prime = 0;
            for (i = 1; i <= n; i++) {
                if (n % i == 0) prime++;
            }
            op.innerHTML = `${n} is `;
            if (prime != 2) op.innerHTML += `not `;
            op.innerHTML += `prime`;
        }
    </script>
</body>

</html>
