<body>
    <script>
        // put 3 dots before argument
        function test(b, ...arr) {
            let sum = 0
            for (let a in arr) {
                sum += arr[a]
            }
            return sum
        }
        console.log(test(1, 12, 123, 1234)) // we can have any number of parameters
    </script>
