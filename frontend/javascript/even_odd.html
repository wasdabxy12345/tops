<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="number" placeholder="enter n" id="n">
    <button onclick="evenOdd(parseInt(document.getElementById('n').value))">submit</button>
    <p id="output"></p>
    <script>
        function evenOdd(n) {
            if (n % 2 == 0) {
                return document.getElementById('output').innerHTML = `${n} is even`;
            }
            else {
                return document.getElementById('output').innerHTML = `${n} is odd`;
            }

        }
    </script>
</body>

</html>
