<!DOCTYPE html>
<html>

<body>
    <h1>JavaScript Objects</h1>
    <h2>Object Destructuring</h2>

    <p id="demo"></p>

    <script>
        // Create an Object
        const person = {
            firstName: "John",
            lastName: "Doe",
            age: 501
        };

        // Destructuring (basically store values of an object in their respective variables)
        let { age, firstName } = person;
        age = age / 2;
        person.age /= 2;

        // Display Primitive Values
        document.getElementById("demo").innerHTML =
            firstName + " " + age + " " + person.age;
    </script>

</body>

</html>
