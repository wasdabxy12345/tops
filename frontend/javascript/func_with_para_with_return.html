<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" placeholder="enter n" id="n">
    <button onclick="console.log(fac(parseInt(document.getElementById('n').value)))">submit</button>
    <p id="output"></p>
    <script>
        function fac(n) {
            let i, fac = 1;
            for (i = 1; i <= n; i++)
                fac *= i;
            return document.getElementById('output').innerHTML = fac;
        }
    </script>
</body>

</html>
