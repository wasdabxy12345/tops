<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="number" placeholder="enter number" id="n">
    <button onclick="prime(parseInt(document.getElementById('n').value))">submit</button>
    <p id="op"></p>
    <script>
        function prime(n) {
            let i, prime = 0, op = document.getElementById('op');
            for (i = 1; i <= n; i++) {
                if (n % i == 0) prime++;
            }
            op.innerHTML = `${n} is `;
            if (prime != 2) op.innerHTML += `not `;
            op.innerHTML += `prime`;
        }
    </script>
</body>

</html>
