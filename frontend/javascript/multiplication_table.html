<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="number" placeholder="enter n1" id="n1">
    <input type="number" placeholder="enter n2" id="n2">
    <button onclick="multiplicationTable(
            parseInt(document.getElementById('n1').value), 
            parseInt(document.getElementById('n2').value)
            )">submit</button>
    <p id="op"></p>
    <script>
        function multiplicationTable(n1, n2) {
            let i = 1;
            while (i <= n2) {
                document.getElementById('op').innerHTML += (`${i} * ${n1} = ${i * n1} <br>`);
                i++;
            }
        }
    </script>
</body>

</html>
