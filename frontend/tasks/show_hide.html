<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="but" onclick="toggle()">hide</button>
    <div id="eg">hello world</div>

    <script>
        function toggle() {
            document.getElementById('eg').style.display = (document.getElementById('but').innerHTML == 'hide' ? 'none' : 'block')
            document.getElementById('but').innerHTML = (document.getElementById('but').innerHTML == 'hide' ? 'show' : 'hide')
        }

    </script>
</body>

</html>
