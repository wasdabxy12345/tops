<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <center>
        <form action="post">
            <h1>Registration Form</h1>
            <label for="">User Id:</label>
            <input type="text" name="" id="" required minlength="5" maxlength="12">
            <label for="">Password:</label>
            <input type="text" name="" id="" required minlength="7" maxlength="12">
            <label for="">Name:</label>
            <input type="text" name="" id="" required pattern="[a-zA-Z]+">
            <label for="">Address:</label>
            <input type="text" name="" id="">
            <label for="">Country</label>

            <label for="">Zip Code:</label>
            <input type="number" name="" id="" required pattern="[0-9]+">
            <label for="">Email:</label>
            <input type="email" name="" id="" required>
            <label for="">Sex:</label>
            <input type="radio" name="" id="">
            <input type="radio" name="" id="">

            <label for="">Language:</label>
            <input type="checkbox" name="" id="">
            <input type="checkbox" name="" id="">

            <label for="">About:</label>
            <input type="text" name="" id="">
            <button>Submit</button>
        </form>
    </center>
</body>

</html>
