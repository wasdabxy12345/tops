<!-- 4.
Build a mini form with an input for 'Username' and use the onchange event to log the entered username to the console
every time the input changes. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action=""><input type="text" name="" id="userName"
            onchange="console.log(document.getElementById('userName').value)"></form>
</body>

</html>
