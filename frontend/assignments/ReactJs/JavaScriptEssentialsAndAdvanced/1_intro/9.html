<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="fun()">Show Greeting</button>
    <p id="a"></p>
    <script>
        function fun() {
            document.getElementById('a').innerHTML = 'Hello from JS!'
        }
    </script>
</body>

</html>
