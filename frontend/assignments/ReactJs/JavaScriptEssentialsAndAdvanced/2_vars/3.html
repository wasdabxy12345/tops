<!-- 3.
Create three variables using let to represent your Instagram profile: userName (your name), followers (number), and
isVerified (true/false). Display all three in the console. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let userName, followers, isVerified
        userName = 'shivam'
        followers = 100000000000000000
        isVerified = true
        console.log(`user name: ${userName}\nfollowers: ${followers}\nverified: ${isVerified ? 'yes' : 'no'}`)
    </script>
</body>

</html>
