<!-- 12.
Show the difference between primitive and reference types by creating a variable favFood = 'pizza' and another variable
favFoodCopy = favFood. Change favFood to 'burger' and log both variables. Then, create an object zomatoUser with a
property city, assign it to another variable, change the city in one, and log both
objects.<br><br><em><strong>Hint:</strong> Observe how changes affect primitives vs objects.</em> -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        favFood = 'pizza'
        favFoodCopy = favFood

        favFood = 'burger'

        console.log(`1st var: ${favFood}\ncopy var: ${favFoodCopy}`)

        zomatoUser = { city: 'abc' }
        zomatoUserCopy = zomatoUser

        zomatoUser.city = 'def'

        console.log(`og obj: ${zomatoUser.city}\ncopy obj: ${zomatoUserCopy.city}`)
    </script>
</body>

</html>
