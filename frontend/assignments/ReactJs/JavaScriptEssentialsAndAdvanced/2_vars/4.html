<!-- 4.
 Declare a variable using var to store the name of your favorite food delivery app (like 'Zomato' or 'Swiggy'). Then,
reassign it to another app name and print both values to the console to show how var allows reassignment and
redeclaration. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var favFoodDeliveryApp = 'zomato'
        console.log(favFoodDeliveryApp)
        favFoodDeliveryApp = 'swiggy'
        console.log(favFoodDeliveryApp)
    </script>
</body>

</html>
