<!-- 3.
Create an HTML file with a <div id="greeting"></div> and use getElementById in a script to set its innerHTML to 'Hello,
welcome to your playlist!' -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="greeting"></div>

    <script>
        document.getElementById('greeting').innerHTML = 'Hello, welcome to your playlist!'
    </script>
</body>

</html>
