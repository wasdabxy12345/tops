<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <input type="text" name="" id="a">
        <button onclick="return add()">Add Song</button>
    </form>

    <ul id="playlist"></ul>

    <script>
        function add() {
            document.getElementById('playlist').appendChild(document.getElementById('a'))

            return false
        }
    </script>
</body>

</html>
