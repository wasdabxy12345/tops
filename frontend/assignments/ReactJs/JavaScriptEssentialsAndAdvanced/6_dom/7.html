<!-- 7.
Select an existing <h2> element with the id 'offer' and use JavaScript to change its text to 'Flat 50% Off on Zomato Today!' and set its color to red using the style property.<br><br><em><strong>Hint:</strong> Use getElementById to select and .style.color to update the color.</em> -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2 id="offer">offer</h2>
    <button onclick="showOffer()">show offer</button>

    <script>
        function showOffer() {
            document.getElementById('offer').innerHTML = 'Flat 50% Off on Zomato Today!';
            document.getElementById('offer').style.color = 'red';
        }
    </script>
</body>

</html>
