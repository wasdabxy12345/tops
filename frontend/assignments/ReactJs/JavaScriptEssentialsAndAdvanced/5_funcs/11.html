<!-- 11.
Build a mini Zomato-style feature: write a function showMenuItem(name, price) that returns a styled HTML div with the
food item's name and price, then call it for three different items and display them on the
page.<br><br><em><strong>Hint:</strong> Use template literals and document.body.appendChild or innerHTML to add the
divs.</em> -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function showMenuItem(name, price) {
            div = document.createElement('div')
            div.innerHTML = `name: ${name}, price: ${price}`
            document.body.appendChild(div)
            return div
        }

        showMenuItem('abc', 123)
        showMenuItem('def', 456)
        showMenuItem('ghi', 789)
    </script>
</body>

</html>
