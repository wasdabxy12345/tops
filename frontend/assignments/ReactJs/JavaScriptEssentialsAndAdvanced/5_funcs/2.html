<!-- 2.
Create a function declaration called createSpotifyButton(label, color) that returns an HTML button element with the
given label and background color, and display it on the page. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body id="button">
    <script>
        function createSpotifyButton(label, color) {
            let button = document.createElement('button')

            button.textContent = label
            button.setAttribute('style', `background-color:${color}`)

            return button
        }

        document.getElementById('button').append(createSpotifyButton('abc', 'red'))
    </script>
</body>

</html>
