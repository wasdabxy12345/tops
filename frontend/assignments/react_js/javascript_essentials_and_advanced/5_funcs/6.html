<!-- 6.
Write an arrow function called formatFollowers that takes a number and returns it formatted as '1.5K' for 1500 or '2M'
for 2000000, similar to how Instagram displays follower counts.<br><br><em><strong>Hint:</strong> Use conditional logic
to check the number's size and format accordingly.</em> -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        formatFollowers = (n) => {
            if (n < 1000) return n
            else if (n < 1000000) return `${(n / 1000).toFixed(1)}K`
            else if (n < 1000000000) return `${(n / 1000000).toFixed(1)}M`
            else if (n < 1000000000000) return `${(n / 1000000000).toFixed(1)}B`
            else return `${(n / 1000000000000).toFixed(1)}T`
        }

        console.log(formatFollowers(123))
        console.log(formatFollowers(2000))
        console.log(formatFollowers(2300))
        console.log(formatFollowers(12345))
        console.log(formatFollowers(20123))
        console.log(formatFollowers(123456))
        console.log(formatFollowers(201234))
        console.log(formatFollowers(1234567))
        console.log(formatFollowers(2012346))
        console.log(formatFollowers(12345678))
        console.log(formatFollowers(20123456))
        console.log(formatFollowers(123456789))
        console.log(formatFollowers(201234567))
        console.log(formatFollowers(1234567890))
        console.log(formatFollowers(2012345678))
        console.log(formatFollowers(12345678901))
        console.log(formatFollowers(20123456789))
        console.log(formatFollowers(123456789012))
        console.log(formatFollowers(201234567890))
        console.log(formatFollowers(1234567890123))
        console.log(formatFollowers(2012345678901))
        console.log(formatFollowers(12345678901234))
        console.log(formatFollowers(20123456789012))
        console.log(formatFollowers(123456789012345))
        console.log(formatFollowers(201234567890123))
    </script>
</body>

</html>
