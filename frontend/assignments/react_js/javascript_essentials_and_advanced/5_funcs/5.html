<!-- 5.
Write a function expression named getDiscountedPrice that takes a price and a discount percent, and returns the final
price after applying the discount (e.g., for Flipkart-style sale banners). -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        getDiscountedPrice = function (price, discountPercent) {
            return price * (1 - discountPercent / 100)
        }

        console.log(getDiscountedPrice(123, 12))
    </script>
</body>

</html>
