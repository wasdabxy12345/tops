<!-- 8.
Use const to create an array called favoriteSongs containing three song titles you like on Spotify. Try to add a fourth
song using push(), then print the array. Explain in a comment why this works even though the array was declared with
const.<br><br><em><strong>Hint:</strong> const prevents reassignment of the variable, not mutation of the array
contents.</em> -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const favoriteSongs = ['abc', 'def', 'ghi']
        favoriteSongs.push('jkl')
        console.log(favoriteSongs)

        // const restricts modifying values assigned at declaration but it doesnt care if a new value is added to an array
    </script>
</body>

</html>
