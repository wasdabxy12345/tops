<!-- 5. 
 Build a small form with an input box and a button labeled 'Add Song'. When the button is clicked, use querySelector
to get the input value and dynamically add a new <li> element with the song name to a <ul id="playlist"> on the page.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <input type="text" name="" id="inputted_song">
        <button onclick="return add()">Add Song</button>
    </form>

    <ul id="playlist"></ul>

    <script>
        function add() {
            document.querySelector('#playlist').innerHTML += `<li>${document.querySelector('#inputted_song').value}</li>`;

            return false
        }
    </script>
</body>

</html>
