<!-- 3.
Create an HTML page with a button labeled 'Add Song' — when the button is clicked, use onclick to instantly add a new
card below showing a random song title from your favorite playlist. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <button onclick="addSong()" id="btn">Add Song</button>
    <div id="cards"></div>

    <script>
        let songs = ['abc', 'def', 'ghi', 'jkl', 'mno', 'pqr', 'stu', 'vwx', 'yz'], t, ri, j = 0;

        for (let i = 0; i < songs.length; i++) {
            ri = Math.floor(Math.random() * songs.length);
            t = songs[i];
            songs[i] = songs[ri];
            songs[ri] = t;
        }

        function addSong() {
            if (j == songs.length) {
                alert('all songs added')
                document.getElementById('btn').disabled = true;
            } else
                document.getElementById('cards').innerHTML += `<div class='card'>${songs[j]}</div>`;
            j++;
        }
    </script>
</body>

</html>
