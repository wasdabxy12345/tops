<!-- 9.
Modify your insta-bio.html file to add a <button> labeled 'Show Greeting'. When the button is clicked, use JavaScript to
show an alert that says 'Hello from JS!'.<br><br><em><strong>Hint:</strong> Use document.querySelector and
addEventListener to connect the button with your JS code.</em> -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="fun()">Show Greeting</button>
    <p id="a"></p>
    <script>
        function fun() {
            document.getElementById('a').innerHTML = 'Hello from JS!'
        }
    </script>
</body>

</html>
